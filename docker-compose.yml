services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=onlinequeue
    volumes:
      - postgres_data:/postgresql/data

  web:
    # image: online-queue-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    env_file: './client/.env'
    depends_on:
      - db
      - server
    environment:
      - PORT=3001
      - NEXTAUTH_URL=http://localhost:3001
      - API_URL=http://server:3000

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file: './server/.env'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/onlinequeue?schema=public
    depends_on:
      - db

volumes:
  postgres_data:
